<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Glacier 3000 Pisteurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Barre d'onglets en haut, puis une colonne de cartes : même style que la page « Ma journée » */
:root {
  /* Mêmes couleurs que la page « Ma journée » : claires le jour, sombres si le téléphone est en mode sombre */
  --bg: #eef3f6; --paper: #ffffff; --ink: #17242e; --muted: #5b6c78; --line: #d5e0e7;
  --accent: #e8622c; --sky: #2f7fb8; --ok: #2e9461;
  --bar: #17324a; --bar-fg: #c9d8e4; --bar-on: #ffffff;
  --red: #d63a3a; --red-bg: #fde8e6; --yel: #b06d00; --yel-bg: #fff1d6; --grn: #2e9461; --grn-bg: #e6f4ec;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f171d; --paper: #18232b; --ink: #e8eff4; --muted: #96a8b5; --line: #2a3a46;
  --accent: #f08354; --sky: #6db3e4; --ok: #5fcf93;
  --bar: #142a3d; --bar-fg: #8fa7ba; --bar-on: #ffffff;
  --red: #f27a74; --red-bg: #3a1f20; --yel: #f0c46e; --yel-bg: #3a2c12; --grn: #5fcf93; --grn-bg: #16301f;
  color-scheme: dark } }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

.topbar { position: sticky; top: 0; z-index: 5; background: var(--bar); padding-top: env(safe-area-inset-top, 0px); }
.tabs[hidden] { display: none; }
.tabs { max-width: 680px; margin: 0 auto; display: flex; gap: 2px; padding: 6px max(8px, env(safe-area-inset-right, 0px)) 6px max(8px, env(safe-area-inset-left, 0px)); }
.tab { flex: 1; min-width: 0; display: grid; justify-items: center; gap: 2px; padding: 8px 2px 6px; border: 0; background: none; color: var(--bar-fg);
  font: 700 11.5px var(--body); border-radius: 12px; cursor: pointer; position: relative; white-space: nowrap; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--bar-on); background: rgba(255,255,255,.1); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 25%; right: 25%; bottom: 0; height: 3px; border-radius: 3px; background: var(--tc); }
.tab .badge { position: absolute; top: 3px; right: calc(50% - 26px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--tc); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }

.wrap { max-width: 680px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(56px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.head .ico { width: 44px; height: 44px; border-radius: 12px; background: var(--tc); color: #fff; display: grid; place-items: center; flex: none; }
.head .ico svg { width: 26px; height: 26px; }
.head h1 { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1.1; margin: 0; }
.head .meta { color: var(--muted); font-size: 14px; }
.status { position: fixed; left: 50%; top: calc(78px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 20;
  background: var(--ink); color: var(--bg); font-weight: 700; font-size: 14px; padding: 8px 16px; border-radius: 999px; max-width: calc(100% - 32px); text-align: center; }
.status.err { background: var(--red); color: #fff; }
.pmeta { margin: 0 0 12px; color: var(--muted); font-size: 14.5px; }
.empty { background: var(--paper); border: 1px dashed var(--line); border-radius: 12px; padding: 14px; color: var(--muted); }
.cat { font-family: var(--display); font-weight: 800; font-size: 20px; margin: 18px 0 8px; }
.note { font-size: 13px; color: var(--muted); margin: -6px 0 14px; }

/* Résumé et alertes */
.s-red { --s: var(--red); --sbg: var(--red-bg); } .s-yel { --s: var(--yel); --sbg: var(--yel-bg); } .s-grn { --s: var(--grn); --sbg: var(--grn-bg); }
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.sum { background: var(--sbg); border: 2px solid var(--s); border-radius: 14px; padding: 10px 12px; }
.sum b { display: block; font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; color: var(--s); }
.sum span { font-size: 13px; font-weight: 700; }
.order { background: var(--red-bg); border: 2px solid var(--red); border-radius: 14px; padding: 12px 14px; margin-bottom: 16px; }
.order h2 { font-family: var(--display); font-size: 18px; margin: 0 0 8px; color: var(--red); }
.order ul, .psum ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.order li, .psum li { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; }
.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 12px; }
.filters button { flex: none; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: 700 14px var(--body); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Cartes */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 12px; display: grid; gap: 6px; min-width: 0; align-content: start; }
.card.s-red { background: linear-gradient(var(--red-bg), var(--paper) 70%); }
.card.sel { box-shadow: 0 0 0 3px var(--accent); }
.top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pic { width: 44px; height: 44px; flex: none; color: var(--muted); }
.nm { font-weight: 700; line-height: 1.25; min-width: 0; overflow-wrap: break-word; hyphens: auto; }
.photo { position: relative; display: block; width: 100%; aspect-ratio: 4 / 3; border: 0; padding: 0; border-radius: 8px; overflow: hidden; background: var(--bg); cursor: pointer; }
.photo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.photo .count { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.65); color: #fff; font: 700 12px var(--body); padding: 2px 8px; border-radius: 99px; }
.big { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.big b { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1; color: var(--ink); }
.chip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--sbg); color: var(--s); border: 1px solid var(--s); white-space: nowrap; }
.gauge { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.gauge i { display: block; height: 100%; background: var(--s); }
.sub2 { font-size: 12px; color: var(--muted); }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.acts button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 700 14px var(--body); border-radius: 8px; padding: 8px 4px; cursor: pointer; }
.acts button.out { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.edit { border: 0; background: none; color: var(--muted); font: 13px var(--body); text-decoration: underline; cursor: pointer; padding: 2px 0; justify-self: start; }
.panel { border-top: 1px dashed var(--line); padding-top: 8px; display: grid; gap: 6px; }
.panel label { font-size: 12px; color: var(--muted); display: grid; gap: 2px; }
.panel input, .panel select { width: 100%; min-width: 0; font: 16px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.go { background: var(--accent); color: #fff; border: 0; border-radius: 8px; font: 700 15px var(--body); padding: 9px; cursor: pointer; }
.go:disabled { opacity: .5; }
.stepper { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; gap: 4px; }
.stepper button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 800 20px var(--body); border-radius: 8px; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; min-height: 40px; }
.stepper input { width: 100%; min-width: 0; text-align: center; font: 800 17px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
.want { font-size: 13px; font-weight: 700; color: var(--accent); }
.want.warn, .warn { color: var(--red); }

/* Formulaires */
details.more summary { cursor: pointer; color: var(--accent); font-weight: 700; margin-top: 16px; }
.form { display: grid; gap: 8px; margin-top: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { min-width: 0; }
.form input, .form select { font: 16px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.btn { font: 700 15px var(--body); border: 0; border-radius: 10px; padding: 10px 16px; background: var(--tc, var(--accent)); color: #fff; cursor: pointer; }
.addbox { display: flex; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 6px 14px; margin-bottom: 14px; }
.addbox input { flex: 1; min-width: 0; border: 0; background: none; font: 17px var(--body); color: var(--ink); padding: 8px 0; }
.addbox input:focus { outline: none; }

/* Préparations */
.psum { background: var(--paper); border: 2px solid var(--accent); border-radius: 14px; padding: 12px 14px; margin-bottom: 16px; display: grid; gap: 8px; }
.psum h2 { font-family: var(--display); font-size: 18px; margin: 0; color: var(--accent); }
.pbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.pbtn { border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 700 15px var(--body); border-radius: 10px; padding: 9px 14px; cursor: pointer; }
.pbtn.main { background: var(--accent); color: #fff; border-color: var(--accent); }
.pbtn.dang { color: var(--red); border-color: var(--red); background: transparent; }
.pbtn:disabled { opacity: .5; }
.preps { display: grid; gap: 8px; }
.prep { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.prep.done { opacity: .7; }
.prep h3 { font-family: var(--display); font-weight: 800; font-size: 18px; margin: 0; overflow-wrap: anywhere; }
.prep small { color: var(--muted); }
.prep ul.plain { margin: 0; padding-left: 18px; }
.got { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.got li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.got input { width: 22px; height: 22px; margin: 0; accent-color: var(--ok); cursor: pointer; }
.got label { cursor: pointer; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.got li.on label { text-decoration: line-through; color: var(--muted); font-weight: 400; }
.prog { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; }
.prog .gauge { flex: 1; } .prog .gauge i { background: var(--ok); }
.prog.full { color: var(--ok); }
textarea.copy { width: 100%; min-height: 120px; font: 15px var(--body); border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--paper); color: var(--ink); }

/* Historique */
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 15px; }
.hist li { display: grid; grid-template-columns: auto 1fr; gap: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.hist .d { font-family: var(--display); font-weight: 800; min-width: 38px; text-align: right; }
.hist .d.neg { color: var(--red); } .hist .d.pos { color: var(--grn); }
.hist small { color: var(--muted); display: block; }

/* Lieux et comptage */
.lieux { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 12px; padding-bottom: 2px; }
.lieux button { flex: none; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: 700 14px var(--body); border-radius: 12px; padding: 7px 12px; cursor: pointer; text-align: left; line-height: 1.2; }
.lieux button small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.lieux button small.late { color: var(--red); font-weight: 700; }
.lieux button[aria-pressed="true"] { background: var(--sky); color: #fff; border-color: var(--sky); }
.lieux button[aria-pressed="true"] small { color: #fff; }
.par { font-size: 12px; color: var(--muted); line-height: 1.35; }
.panel select { width: 100%; }
.clist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.crow { display: grid; grid-template-columns: 40px minmax(0, 1fr) 130px; gap: 10px; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.crow.chg { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.crow .pic { width: 40px; height: 40px; }
.crow .nm small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.crow .stepper { grid-template-columns: 36px minmax(0, 1fr) 36px; }
.savebar { position: sticky; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); margin-top: 14px; background: var(--paper); border: 2px solid var(--accent); border-radius: 14px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.savebar b { font-size: 15px; }
.savebar .btn { --tc: var(--accent); }

/* Commandes */
.ocard { background: var(--paper); border: 1px solid var(--line); border-left: 6px solid var(--oc); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.ocard.a_monter { --oc: var(--accent); } .ocard.en_route { --oc: var(--yel); } .ocard.livree { --oc: var(--grn); opacity: .75; }
.route { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1.2; }
.route .arr { color: var(--accent); font-size: 22px; }
.ostat { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--oc); color: var(--oc); }
.ocard ul { margin: 0; padding-left: 18px; font-weight: 700; }
.ocard .meta2 { font-size: 13px; color: var(--muted); }
.ocard .onote { font-size: 14px; background: var(--bg); border-radius: 8px; padding: 6px 10px; overflow-wrap: anywhere; }
.newcmd { background: var(--paper); border: 2px solid var(--accent); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; margin-bottom: 16px; }
.newcmd h2 { font-family: var(--display); font-size: 18px; margin: 0; color: var(--accent); }
.newcmd label { font-size: 13px; color: var(--muted); display: grid; gap: 3px; font-weight: 700; }
.newcmd select, .newcmd input[type=text] { font: 16px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 100%; min-width: 0; }
.bigbtn { width: 100%; font: 800 17px var(--body); padding: 14px; border-radius: 14px; border: 2px dashed var(--accent); background: var(--paper); color: var(--accent); cursor: pointer; margin-bottom: 16px; }
.crow .stk { font-size: 12px; color: var(--muted); }
.crow.sel { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }

/* Accueil et formation */
.homebar { max-width: 680px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px max(12px, env(safe-area-inset-right, 0px)) 4px max(12px, env(safe-area-inset-left, 0px)); color: var(--bar-on); }
.homebar .brand { font-family: var(--display); font-weight: 800; font-size: 20px; }
.homebar .brand small { display: block; font: 600 12px var(--body); color: var(--bar-fg); letter-spacing: .06em; text-transform: uppercase; }
.homebar button { border: 0; background: #ffffff; color: #17324a; font: 800 16px var(--body); border-radius: 12px; padding: 10px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; flex: none; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.homebar button svg { width: 20px !important; height: 20px !important; }
.homebar .where { font-family: var(--display); font-weight: 800; font-size: 18px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.tile { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; text-align: left; border: 0; border-radius: 18px; padding: 20px 18px; min-height: 120px;
  background: var(--tc); color: #fff; cursor: pointer; box-shadow: 0 6px 18px rgba(23,50,74,.18); }
.tile svg { width: 56px; height: 56px; }
.tile b { display: block; font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1.05; }
.tile span { display: block; font-size: 14px; opacity: .9; margin-top: 4px; }
.tile:active { transform: scale(.98); }
.tile.light { background: var(--paper); color: var(--ink); border: 2px solid var(--tc); box-shadow: none; }
.tile.light svg { color: var(--tc); }
.vids { display: grid; gap: 14px; }
.vid { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; min-width: 0; }
.vid .frame { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; }
.vid iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.vid .info { padding: 12px 14px; display: grid; gap: 4px; }
.vid h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1.2; overflow-wrap: anywhere; }
.vid p { margin: 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.vid .acts2 { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.vid a { color: var(--sky); font-weight: 700; font-size: 14px; }
.ytlink { display: grid; place-items: center; gap: 6px; aspect-ratio: 16 / 9; background: #17242e; color: #fff; text-decoration: none; font-weight: 700; }
.ytlink svg { width: 64px; height: 64px; color: #ff3b30; }
.vid a.ytlink { color: #fff; font-size: 16px; }

/* Planning */
.pl-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; position: sticky; top: var(--tb, 60px); z-index: 4; background: var(--bg); margin: -4px -4px 8px; padding: 8px 4px; }
.pl-nav button[disabled] { opacity: .45; cursor: default; }
.pl-head { display: flex; align-items: center; gap: 8px; margin: 2px 0 10px; min-height: 40px; }
.pl-head .pl-title { margin: 0; flex: 1; min-width: 0; }
.pl-back { border: 0; background: var(--accent); color: #fff; font: 800 15px var(--body); border-radius: 999px; padding: 9px 14px 9px 10px; cursor: pointer; flex: none; box-shadow: 0 2px 6px rgba(14, 138, 154, .35); }
.pl-stage { touch-action: pan-y; will-change: transform; }
.pl-stage.anim { transition: transform .22s ease, opacity .22s ease; }
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; margin-bottom: 10px; }
.strip button { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 5px 0 6px; font: inherit; color: inherit; cursor: pointer; display: grid; justify-items: center; gap: 1px; min-width: 0; }
.strip .d { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.strip .n { font: 800 17px var(--display); }
.strip .dots { display: flex; gap: 2px; height: 6px; }
.strip .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--ec); }
.strip button.today .n { color: var(--accent); }
.strip button[aria-current="date"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.strip button[aria-current="date"] .d, .strip button[aria-current="date"] .n { color: #fff; }
.pl-swipe { font-size: 12.5px; color: var(--muted); text-align: center; margin: 8px 0 0; }
.pl-seg { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.pl-seg button { border: 0; background: none; color: var(--muted); font: 700 14px var(--body); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
.pl-seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.pl-nav { display: inline-flex; gap: 4px; align-items: center; }
.pl-nav button { border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: 700 15px var(--body); border-radius: 10px; padding: 7px 12px; cursor: pointer; min-width: 40px; }
.pl-title { font-family: var(--display); font-weight: 800; font-size: 22px; margin: 0 0 10px; }
.pl-title::first-letter { text-transform: uppercase; }
.pl-add { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); float: right; margin-top: 12px; border: 0; border-radius: 999px; background: var(--accent); color: #fff;
  font: 800 17px var(--body); padding: 14px 22px; cursor: pointer; box-shadow: 0 6px 16px rgba(14,138,154,.35); z-index: 3; }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.month .dow { font-size: 12px; font-weight: 700; color: var(--muted); text-align: center; text-transform: uppercase; padding-bottom: 2px; }
.mday { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; min-height: 74px; padding: 3px; display: grid; align-content: start; gap: 2px; cursor: pointer; text-align: left; font: inherit; color: inherit; min-width: 0; }

.mday.today { border: 2px solid var(--accent); }

.chipev { display: block; font-size: 10.5px; font-weight: 700; line-height: 1.25; color: #fff; background: var(--ec); border-radius: 4px; padding: 1px 3px; overflow: hidden; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-top: 2px; }

.week { display: grid; gap: 8px; }
/* Grille horaire façon Google Agenda */
.tg { --hh: 44px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }

.tg-head { border-bottom: 1px solid var(--line); }

.tg-dh .n { font: 800 18px var(--display); width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; }

.tg-dh.today .n { background: var(--accent); color: #fff; }
.tg-all { border-bottom: 1px solid var(--line); min-height: 6px; }
.tg-all .lab { font-size: 9.5px; color: var(--muted); padding: 4px 2px; line-height: 1.1; }

.tg-hours { position: relative; }
.tg-hours span { position: absolute; right: 4px; font-size: 10.5px; color: var(--muted); transform: translateY(-50%); }
.tg-col { position: relative; border-left: 1px solid var(--line); cursor: pointer; min-width: 0;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--hh) - 1px), var(--line) calc(var(--hh) - 1px), var(--line) var(--hh)); }
.tg-col.today { background-color: rgba(14, 138, 154, .06); }
.tg-ev { position: absolute; border: 0; border-radius: 5px; background: var(--ec); color: #fff; font: 700 10.5px/1.2 var(--body); text-align: left; padding: 2px 3px; overflow: hidden; cursor: pointer; box-shadow: 0 0 0 1px var(--paper); }

/* Stock : une ligne par article */
.cards.list { grid-template-columns: 1fr; gap: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.card.srow { grid-template-columns: 48px minmax(0, 1fr) auto; grid-template-areas: "pic nm big" "pic par par" "pic acts acts" "pnl pnl pnl"; gap: 2px 12px; align-items: center; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 14px 14px 14px 10px; background: transparent; }
.card.srow:first-child { border-top: 0; }
.card.srow .top { display: contents; }
.card.srow .top .pic, .card.srow .top svg { grid-area: pic; align-self: start; width: 44px; height: 44px; }
.card.srow .photo { grid-area: pic; align-self: start; width: 48px; height: 48px; aspect-ratio: 1; border-radius: 10px; }
.card.srow .photo img { object-fit: cover; }

.card.srow .nm { grid-area: nm; font-size: 17px; }

.card.srow .par { grid-area: par; font-size: 14px; color: var(--muted); }
.card.srow .acts { grid-area: acts; grid-template-columns: 1fr 1fr 44px; gap: 8px; margin-top: 8px; }
.card.srow .acts button { background: transparent; font-size: 15px; padding: 9px 6px; border-radius: 10px; border: 1.5px solid var(--line); color: var(--ink); }
.card.srow .acts button.out { border-color: rgba(255,107,94,.55); color: #ffb3aa; }
.card.srow .acts button:nth-child(2) { border-color: rgba(111,211,154,.55); color: #a8ecc4; }
.card.srow .acts button.more { color: var(--muted); font-weight: 800; }
.card.srow .panel { grid-area: pnl; margin-top: 10px; }
@media (min-width: 900px) { .cards.list { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cards.list .card.srow:nth-child(2) { border-top: 0; } .cards.list .card.srow:nth-child(odd) { border-right: 1px solid var(--line); } }
.pl-back, .pl-add, .strip button[aria-current="date"], .tg-dh.today .n { color: #1c2a23 !important; }
.pbtn.main.acc { background: var(--accent) !important; border-color: var(--accent) !important; color: #1c2a23 !important; }

/* Accueil : lignes sobres, icône en couleur dans un petit carré */
.tiles { gap: 10px; }
.tile, .tile.light { background: var(--paper); color: var(--ink); box-shadow: none; border: 1px solid var(--line); min-height: 0; padding: 16px; grid-template-columns: 56px minmax(0, 1fr) auto; border-radius: 16px; }
.tile > svg { box-sizing: content-box; width: 30px; height: 30px; padding: 12px; border-radius: 14px; color: color-mix(in srgb, var(--tc) 62%, #fff); background: color-mix(in srgb, var(--tc) 26%, transparent); }

.tile span { color: var(--muted); opacity: 1; font-size: 14px; }
.tile::after { content: "›"; font: 700 28px var(--body); color: var(--muted); }
/* Ordinateur et tablette : l'appli prend la largeur de l'écran, en plus grand */
@media (min-width: 1000px) {
  .wrap, .tabs, .homebar { max-width: 1180px; }
  body { zoom: 1.25; }
  .tiles { grid-template-columns: repeat(3, 1fr); }
}
@media (min-width: 1700px) { body { zoom: 1.4; } }


/* ===== Présentation « Ma journée » : mêmes couleurs, cartes et pastilles ===== */

/* Glisser une tâche : la carte s'écarte, on touche « C'est fait » (à gauche) ou « Supprimer » (à droite) */
.sw { position: relative; border-radius: 12px; overflow: hidden; }
.sw-bg { position: absolute; inset: 0; visibility: hidden; }
.sw.r .sw-bg, .sw.l .sw-bg { visibility: visible; }
.sw-act { position: absolute; top: 0; bottom: 0; width: var(--sw, 132px); border: 0; color: #fff; font: 700 15px var(--body); cursor: pointer; display: none; }
.sw-act.a { left: 0; background: #2e9461; }
.sw-act.b { right: 0; background: #d63a3a; }
.sw.r .sw-act.a, .sw.l .sw-act.b { display: block; }
.sw > .tk { position: relative; touch-action: pan-y; transition: transform .2s ease; user-select: none; -webkit-user-select: none; }
.sw.drag > .tk, .sw.lift > .tk { transition: none; }
#view.chalk .tk.hasgrip { grid-template-columns: 44px minmax(0,1fr) 34px; }
.tk .grip { display: grid; place-items: center; color: var(--muted); touch-action: none; cursor: grab; }
.sw.lift { overflow: visible; z-index: 3; }
#view.chalk .sw.lift > .tk, #view.chalk .sw.lift > .tk.urg { background: color-mix(in srgb, var(--accent) 18%, var(--paper)); border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 14px 30px rgba(0,0,0,.3); transform: scale(1.03); }
.sw.lift .grip { color: var(--accent); }
.moving > .sw:not(.lift) { opacity: .4; transition: opacity .15s; }
.sw > .tk * { -webkit-touch-callout: none; }
#snack { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 12px; background: #17242e; color: #fff; font: 600 16px var(--body); border-radius: 12px; padding: 8px 8px 8px 16px; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: calc(100% - 24px); white-space: nowrap; }
#snack[hidden] { display: none; }
#snack button { border: 0; background: none; color: #ffb08a; font: 800 16px var(--body); padding: 10px 12px; cursor: pointer; }

    var r = el("div", "route"); r.appendChild(el("span", null, o.from)); r.appendChild(el("span", "arr", "→")); r.appendChild(el("span", null, placeName(o.to)));
    r.appendChild(el("span", "ostat", OSTAT[o.status] || o.status)); c.appendChild(r);
    var ul = el("ul"); (o.lines || []).forEach(function (l) { ul.appendChild(el("li", null, l.qty + " × " + l.name)); }); c.appendChild(ul);
    if (o.note) c.appendChild(el("div", "onote", o.note));
    c.appendChild(el("div", "meta2", o.status === "livree" ? "Livrée " + ago2(o.doneAt) : o.status === "en_route" ? "Prise en charge " + ago2(o.takenAt) : "Demandée " + ago2(o.created)));
    if (o.status !== "livree") {
      var bt = el("div", "pbtns");
      if (o.status === "a_monter") {
        var take = el("button", "pbtn", "Je m'en occupe"); take.type = "button";
        take.addEventListener("click", function () { take.disabled = true; act("prendreCommande", [o.id], "Pris en charge").catch(function () { take.disabled = false; }); });
        bt.appendChild(take);
      }
      var done = el("button", "pbtn main", "Livré ✓"); done.type = "button"; done.style.background = "var(--grn)"; done.style.borderColor = "var(--grn)";
      done.addEventListener("click", function () {
        if (!twoStep(done, o.to === PISTE ? "Confirmer : sortir du stock" : "Confirmer : déplacer le stock")) return;
        done.disabled = true; act("livrerCommande", [o.id], "Livrée, stock mis à jour").catch(function () { done.disabled = false; });
      });
      bt.appendChild(done);
      var del = el("button", "pbtn dang", "Annuler le transfert"); del.type = "button";
      del.addEventListener("click", function () { if (twoStep(del, "Confirmer l'annulation")) act("supprimerCommande", [o.id], "Transfert annulé").catch(function () {}); });
      bt.appendChild(del); c.appendChild(bt);
    }
    return c;
  }

  /* ---------- Comptage de la semaine ---------- */
  function renderCount() {
    var v = clearView();
    var nLate = data.lieux.filter(late).length;
    header(v, "count", "#2f7fb8", "Comptage", nLate ? (nLate > 1 ? nLate + " locaux" : "1 local") + " à compter cette semaine" : "Tous les locaux ont été comptés cette semaine");
    countLieu = validLieu(countLieu) || (data.lieux.filter(late)[0] || data.lieux[0]).name;
    var lz = el("div", "lieux"); lz.setAttribute("role", "group"); lz.setAttribute("aria-label", "Local à compter");
    data.lieux.forEach(function (l) {
      var b = el("button", null, l.name); b.type = "button"; b.setAttribute("aria-pressed", countLieu === l.name ? "true" : "false");
      b.appendChild(el("small", late(l) ? "late" : null, ago(l.last)));
      b.addEventListener("click", function () {
        if (Object.keys(countDraft).length && countLieu !== l.name && !confirmLeave(b)) return;
        countLieu = l.name; countDraft = {}; try { localStorage.setItem("stock-pistes-count", countLieu); } catch (e) {} renderCount();
      });
      lz.appendChild(b);
    });
    v.appendChild(lz);
    v.appendChild(el("p", "note", "Compte ce qu'il y a dans le local et corrige les chiffres qui ne vont pas. Ceux que tu ne touches pas restent comme ils sont."));

    var nChg = Object.keys(countDraft).length;
    CATS.forEach(function (c) {
      var inCat = data.stock.filter(function (s) { return s.cat === c; }); if (!inCat.length) return;
      v.appendChild(el("h2", "cat", c));
      var ul = el("ul", "clist");
      inCat.forEach(function (s) {
        var cur = s.par[countLieu] || 0, val = s.id in countDraft ? countDraft[s.id] : cur;
        var li = el("li", "crow" + (s.id in countDraft ? " chg" : ""));
        li.innerHTML = pictoSvg(s);
        var nm = el("div", "nm", s.name); nm.appendChild(el("small", null, s.id in countDraft ? "avant : " + cur : "actuel : " + cur)); li.appendChild(nm);
        var stp = el("div", "stepper");
        var minus = el("button", null, "−"); minus.type = "button"; minus.setAttribute("aria-label", "Moins de " + s.name);
        var qi = document.createElement("input"); qi.type = "number"; qi.min = "0"; qi.inputMode = "numeric"; qi.value = val; qi.id = "cq-" + s.id; qi.setAttribute("aria-label", "Nombre de " + s.name + " à " + countLieu);
        var plus = el("button", null, "+"); plus.type = "button"; plus.setAttribute("aria-label", "Plus de " + s.name);
        var setV = function (n, rerender) {
          n = Math.max(0, n || 0);
          if (n === cur) delete countDraft[s.id]; else countDraft[s.id] = n;
          if (rerender) { var y = window.scrollY; renderCount(); window.scrollTo(0, y); }
          else { li.className = "crow" + (s.id in countDraft ? " chg" : ""); nm.lastChild.textContent = s.id in countDraft ? "avant : " + cur : "actuel : " + cur; updateBar(); }
        };
        minus.addEventListener("click", function () { var n = (s.id in countDraft ? countDraft[s.id] : cur) - 1; qi.value = Math.max(0, n); setV(n); });
        plus.addEventListener("click", function () { var n = (s.id in countDraft ? countDraft[s.id] : cur) + 1; qi.value = n; setV(n); });
        qi.addEventListener("input", function () { if (qi.value !== "") setV(parseInt(qi.value, 10)); });
        stp.appendChild(minus); stp.appendChild(qi); stp.appendChild(plus); li.appendChild(stp);
        ul.appendChild(li);
      });
      v.appendChild(ul);
    });

    var bar = el("div", "savebar"), lab = el("b"); bar.appendChild(lab);
    var save = el("button", "btn", "Enregistrer le comptage"); save.type = "button"; bar.appendChild(save);
    function updateBar() {
      var n = Object.keys(countDraft).length;
      lab.textContent = n ? n + " chiffre" + (n > 1 ? "s" : "") + " corrigé" + (n > 1 ? "s" : "") + " · " + countLieu : "Tout est juste ? Valide quand même pour dater le comptage.";
    }
    updateBar();
    save.addEventListener("click", function () {
      save.disabled = true;
      act("comptage", [countLieu, countDraft], "Comptage de " + countLieu + " enregistré").then(function () { countDraft = {}; renderCount(); }, function () { save.disabled = false; });
    });
    v.appendChild(bar);
  }
  var leaveArmed = null;
  function confirmLeave(btn) {
    if (leaveArmed === btn) { leaveArmed = null; return true; }
    leaveArmed = btn; showStatus("Comptage pas enregistré : touche encore pour changer de local et l'abandonner", true);
    setTimeout(function () { if (leaveArmed === btn) leaveArmed = null; }, 4000);
    return false;
  }

  /* ---------- Historique ---------- */
  function renderHist() {
    var v = clearView();
    header(v, "clock", "#5b6c78", "Historique", "");
    if (!data.moves.length) { v.appendChild(el("p", "empty", "Aucun mouvement pour l'instant.")); return; }
    var h = el("ul", "hist");
    data.moves.forEach(function (m) {
      var li = el("li"), when = new Date(m.at || 0);
      li.appendChild(el("span", "d " + (m.delta < 0 ? "neg" : "pos"), (m.delta > 0 ? "+" : "") + m.delta));
      var w = el("span", null, m.name);
      w.appendChild(el("small", null, when.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }) + " " + pad(when.getHours()) + ":" + pad(when.getMinutes()) + (m.lieu ? " · " + m.lieu : "") + (m.where ? " · " + m.where : "")));
      li.appendChild(w); h.appendChild(li);
    });
    v.appendChild(h);
  }

  /* ---------- Démarrage ---------- */
  if (code) { try { var c0 = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); if (c0 && c0.stock) { data = c0; renderAll(); } } catch (e) { data = null; try { localStorage.removeItem(CACHE_KEY); } catch (x) {} } }
  if (code) load(!!data); else renderGate(false);
})();
</script>
</body>
</html>
