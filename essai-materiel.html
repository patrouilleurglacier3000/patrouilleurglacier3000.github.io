<!DOCTYPE html><html lang=fr><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Essai – Où est le matériel ?</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f6;--paper:#fff;--ink:#17242e;--muted:#5b6c78;--line:#d5e0e7;--accent:#e8622c;--bar:#17324a;--bar-fg:#c9d8e4;--grn:#2e9461;--grn-bg:#e6f4ec;--yel:#b06d00;--yel-bg:#fff1d6;--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f171d;--paper:#18232b;--ink:#e8eff4;--muted:#96a8b5;--line:#2a3a46;--accent:#f08354;--bar:#142a3d;--bar-fg:#8fa7ba;--grn:#5fcf93;--grn-bg:#16301f;--yel:#f0c46e;--yel-bg:#3a2c12}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4}
.top{background:var(--bar);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.top b{font-family:var(--display);font-size:22px}.top span{color:var(--bar-fg);font-size:14px;margin-left:auto}
.ess{background:var(--yel-bg);color:var(--yel);font-weight:700;text-align:center;padding:8px;font-size:14px}
main{max-width:640px;margin:0 auto;padding:14px}
h2{font-family:var(--display);font-size:20px;margin:18px 2px 8px}
.it{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;display:flex;min-height:96px}
.ph{width:110px;flex:none;background:var(--line) center/cover;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:30px}
.tx{padding:12px 14px;flex:1;min-width:0}
.nm{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.15}
.lc{font-size:19px;font-weight:700;margin-top:4px;display:flex;gap:6px}
.by{color:var(--muted);font-size:14px;margin-top:4px}
.mv{border:0;background:var(--accent);color:#fff;font:700 17px var(--body);padding:0 16px;flex:none;cursor:pointer;min-width:92px}
.new{animation:fl 1.6s}@keyframes fl{0%{box-shadow:0 0 0 4px var(--grn)}100%{box-shadow:0 0 0 0 transparent}}
.sh{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:9}
.sh.on{display:flex}.pn{background:var(--paper);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px 24px;max-height:92vh;overflow:auto}
.pn h3{font-family:var(--display);font-size:24px;margin:0 0 4px}.pn .sub{color:var(--muted);margin-bottom:14px}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ch button{border:2px solid var(--line);background:var(--bg);color:var(--ink);font:700 17px var(--body);padding:12px 14px;border-radius:12px;cursor:pointer}
.ch button.on{border-color:var(--accent);background:var(--accent);color:#fff}
input[type=text]{width:100%;font:700 19px var(--body);padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.cam{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:12px 0;padding:18px;border:2px dashed var(--line);border-radius:12px;font:700 19px var(--body);color:var(--ink);cursor:pointer;background:none}
.prev{width:100%;border-radius:12px;display:none;margin-bottom:10px}
.ok{width:100%;border:0;background:var(--grn);color:#fff;font:700 21px var(--body);padding:18px;border-radius:14px;cursor:pointer}
.no{width:100%;border:0;background:none;color:var(--muted);font:700 17px var(--body);padding:14px;cursor:pointer}
.zm{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:10;flex-direction:column;gap:10px;color:#fff}
.zm.on{display:flex}.zm img{max-width:100%;max-height:80vh}
</style></head><body>
